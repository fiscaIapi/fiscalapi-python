# Publica no PyPI a cada tag vX.Y.Z, via Trusted Publishing (OIDC) — sem token.
# A tag precisa bater com a versão do pyproject.toml e do _version.py.
# Configuração única no PyPI (o projeto ainda não existe, então é um "pending
# publisher"): Account settings → Publishing → Add a new pending publisher →
# GitHub: project "fiscalapi-br", owner "fiscaIapi", repo "fiscalapi-python",
# workflow "publish.yml", environment "pypi".
name: Publish

on:
  push:
    tags: ['v*.*.*']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confere a tag com a versão do pacote
        run: |
          tag="${GITHUB_REF_NAME#v}"
          proj=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          mod=$(python -c "import re; print(re.search(r'\"(.+)\"', open('src/fiscalapi_br/_version.py').read()).group(1))")
          echo "tag=$tag pyproject=$proj _version=$mod"
          [ "$tag" = "$proj" ] && [ "$tag" = "$mod" ]
      - name: Build sdist e wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # Trusted Publishing + atestação de proveniência
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
