# Publica no PyPI a cada tag vX.Y.Z, via Trusted Publishing (OIDC) — sem token.
# Configuração única no PyPI: Your projects → fiscalapi-br → Publishing →
# Add a new publisher → GitHub: owner "fiscaIapi", repo "fiscalapi-python",
# workflow "publish.yml", environment "pypi".
name: Publish

on:
  push:
    tags: ['v*.*.*']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build sdist e wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # Trusted Publishing + atestação de proveniência
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
