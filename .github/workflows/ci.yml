name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python: ['3.9', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip build ruff
      - run: ruff check src examples
      - run: python -m build
      - name: Smoke test (importa sem rede)
        run: |
          pip install dist/*.whl
          python -c "from fiscalapi_br import FiscalAPI; FiscalAPI('x'); print('ok')"
